<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Fund | Extract</title>
<link rel="stylesheet" href="css/admin-add-fund.css">
</head>
<body>

<header class="topbar">
  <span class="back-btn" onclick="goBack()">←</span>
  <h2>Add Fund</h2>
</header>

<main class="container">

<form id="fundForm" class="fund-form">

  <label for="amount">Amount</label>
  <input type="number" id="amount" required>

  <label for="reason">Reason</label>
  <input type="text" id="reason" required>

  <label for="date">Date</label>
  <input type="date" id="date">

  <label for="time">Time</label>
  <input type="time" id="time">

  <button type="submit">Add Fund</button>

</form>


<section class="history">
  <h3>Fund History</h3>
  <!-- <div id="fundList"></div> -->
   <div id="fundHistory"></div>
</section>


</main>

<script src="js/admin-add-fund.js"></script>
</body>
</html>
